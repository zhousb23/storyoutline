name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: kivy/buildozer
    steps:
      - uses: actions/checkout@v4

      - name: Copy entry
        run: cp src/kivy_app.py main.py

      - name: Build APK
        run: buildozer android debug
        timeout-minutes: 40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryOutline-APK
          path: /home/user/app/bin/*.apk

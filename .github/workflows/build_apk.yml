name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip openjdk-17-jdk-headless unzip zip libtool autoconf-archive pkg-config
          pip install buildozer cython pillow requests
          
      - name: Build APK
        run: buildozer android debug
        timeout-minutes: 40

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryOutline-APK
          path: bin/*.apk


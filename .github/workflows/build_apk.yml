name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk-headless unzip zip
          pip install buildozer cython pillow requests

           - name: Build APK
        run: |
          yes | /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses --sdk_root=/home/runner/.buildozer/android/platform/android-sdk 2>/dev/null || true
          buildozer android debug


           - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          yes | $ANDROID_SDK_ROOT/tools/bin/sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT
          buildozer android debug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryOutline-APK
          path: bin/*.apk
